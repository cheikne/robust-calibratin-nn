
<div class="mt-4">
  <div class="model-selector d-flex justify-content-center" role="radiogroup" aria-label="Select model">
        <!-- <label *ngFor="let m of modelOptions" class="model-option btn btn-sm" [class.active]="selectedModel === m.value">
          <input type="radio" name="model"  [value]="m.value" (change)="selectModel(m.value)" [checked]="selectedModel === m.value" hidden />
          {{ m.label }}
        </label> -->
    </div>

  
    
  <div class="boxes-wrapper d-flex flex-lg-row flex-column gap-4 mt-5">

    <div class="model-noise-select w-100 mb-2 d-flex flex-column align-items-center">
        <div class="model-choice mb-2 d-flex justify-content-center gap-2" role="radiogroup" aria-label="Choisir modèle">
          <button type="button" class="btn btn-outline-primary btn-sm" (click)="selectModelType('CNN')" [class.active]="selectedModelType === 'CNN'">CNN</button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="selectModelType('MLP')" [class.active]="selectedModelType === 'MLP'">MLP</button>
        </div>

      <div class="noise-choice d-flex justify-content-center gap-2" role="group" aria-label="Choisir type de bruit">
        <button type="button" class="btn btn-sm btn-outline-dark" (click)="selectPerturbation('gaussian')" [class.active]="selectedPerturbation === 'gaussian'">Gaussian noise</button>
        <button type="button" class="btn btn-sm btn-outline-dark" (click)="selectPerturbation('rotate')" [class.active]="selectedPerturbation === 'rotate'">Image rotation</button>
        <button type="button" class="btn btn-sm btn-outline-dark" (click)="selectPerturbation('blur')" [class.active]="selectedPerturbation === 'blur'">Blur</button>
      </div>
      <div class="perturbation-control mt-2 d-flex flex-column align-items-center">
        <label class="mb-1">Perturbation level: <strong>{{ perturbationLevel }}</strong></label>
        <input type="range" min="0" max="1" step="0.01" (input)="onPerturbationLevelChange($event)" [value]="perturbationLevel" />
      </div>
      <div class="stroke-control mt-2 d-flex flex-column align-items-center">
        <label class="mb-1">Stroke width: <strong>{{ strokeWidth }}</strong></label>
        <input type="range" min="1" max="20" step="1" (input)="onStrokeWidthChange($event)" [value]="strokeWidth" />
      </div>
    </div>
</div>

<div class="page-center d-flex justify-content-center align-items-center">
    
  <div class="boxes-wrapper d-flex flex-lg-row flex-column gap-4">

    
 

    <!-- BOX 1: Canvas + controls -->
    <div class="box canvas-box p-4">
      <h5 class="text-center mb-3">Draw & Predict</h5>

 

      <div class="text-center">
        <canvas
          #canvas
          width="280"
          height="280"
          class="border border-dark rounded"
          (mousedown)="startDrawing($event)"
          (mouseup)="stopDrawing()"
          (mouseleave)="stopDrawing()"
          (mousemove)="draw($event)"
        ></canvas>

        <div class="mt-3 d-flex justify-content-center gap-2">
          <button class="btn btn-sm btn-danger" (click)="clear()">Clear</button>
          <button class="btn btn-sm btn-success" (click)="predict()">Predict</button>
          <button class="btn btn-sm btn-secondary" (click)="displayImage()">Display</button>
          <button class="btn btn-sm btn-warning" (click)="applyAttack()">Apply Attack</button>
        </div>


        <div class="mt-3" >
          <h6>Drawn Image:</h6>
          <img alt="Drawn digit" class="border rounded" width="140">
        </div>
      </div>
    </div>

</div>
</div>
</div>
